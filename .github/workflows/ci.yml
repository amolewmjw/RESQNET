name: Sprint 1 checks
on: [push, pull_request]
jobs:
  foundation:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start backend and run browser tests
        shell: bash
        run: |
          cd backend
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/resqnet-backend.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid"' EXIT
          python - <<'PYCODE'
          import time, urllib.request
          for attempt in range(50):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=1)
                  break
              except OSError:
                  time.sleep(0.2)
          else:
              raise SystemExit('Backend failed to start')
          PYCODE
          cd ../frontend
          npm run test:e2e
